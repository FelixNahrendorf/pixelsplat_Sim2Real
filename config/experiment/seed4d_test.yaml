# @package _global_

defaults:
  - override /dataset: seed4d
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips, mae]

wandb:
  name: seed
  tags: [seed, 128x128]

dataset:
  image_shape: [128, 128] # [128, 128]  # 
  roots: [datasets/seed4d]
  training_towns: ['01','03','04','05','06','07', '10HD']  # Configure training towns here #training_towns = ['01','03','04','05','06','07', '10HD']
  testing_towns: ['02']   # Configure testing towns here
  selected_sensors: [0, 1, 2, 3, 4, 5]  # List of sensor indices to use (0-6 based on transforms_ego.json)
  experiment: ego-exo-mixed-domain #ego-exo-mixed #ego-ego 

data_loader:
  train:
    batch_size: 2 # 7 

test:
  depth_mode: depth
  output_path: /app/outputs/ego_exo_mixed_domain_testrun #/app/outputs/pixelsplat_new_training_Diverse_Ego-Exo-Mixed-Domain-eval_ego-exo_Nuscene #/app/outputs/ego_exo_sensitivity_analysis/data_7cams_nuscene_adjusted
  compute_scores: true


trainer:
  max_steps: 300_001
