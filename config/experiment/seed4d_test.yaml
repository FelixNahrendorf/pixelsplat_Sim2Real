# @package _global_

defaults:
  - override /dataset: seed4d
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips, mae]

wandb:
  name: seed
  tags: [seed, 256x256]

dataset:
  image_shape: [256, 256]
  roots: [datasets/seed4d]
  training_towns: ['02']  # Configure training towns here #training_towns = ['01','03','04','05','06','07', '10HD']
  testing_towns: ['02']   # Configure testing towns here
  # New sensor selection parameters
  selected_sensors: [0, 1, 2, 3, 4, 5, 6]  # List of sensor indices to use (0-6 based on transforms_ego.json)
  # Alternative: you can also specify sensor ranges
  # sensor_range: [0, 6]  # Use sensors from index 0 to 6 (inclusive)

data_loader:
  train:
    batch_size: 1 # 7 

test:
  depth_mode: depth
  output_path: outputs/test/seed4d
  compute_scores: true

trainer:
  max_steps: 300_001