# @package _global_

defaults:
  - override /dataset: seed4d #nuscene #
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips] #[mse, lpips, mae] #  

wandb:
  name: seed
  tags: [seed, 128x128] #[seed, 256x256] #[seed, 128x128]
  mode: offline

dataset:
  image_shape: [128, 128] #[256, 256] #[128, 128] # [128, 128]  # 
  roots: [datasets/seed4d] #[datasets/nuscene] # #
  training_towns: ['01','03','04','05','06','07', '10HD']  # Configure training towns here #training_towns = ['01','03','04','05','06','07', '10HD']
  testing_towns: ['02']   # Configure testing towns here
  selected_sensors: [0, 1, 2, 3, 4, 5]  # List of sensor indices to use (0-6 based on transforms_ego.json)
  experiment: ego-ego-nuscenes #exo-mixed-domain #ego-nuscenes #ego-exo-mixed #ego-ego # ego-exo-nuscenes 

