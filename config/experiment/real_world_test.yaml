# @package _global_

defaults:
  - override /dataset: nuscene
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips]

wandb:
  name: nuscene
  tags: [seed, 256x256]

dataset:
  image_shape: [64, 64] #[256, 256]
  roots: [dataset/nuscene]

data_loader:
  train:
    batch_size: 1 # 7 

trainer:
  max_steps: 400_001
  #devices: 1
  #accelerator: gpu
  #strategy:  "single_device"
  #num_nodes: 1

test:
  depth_mode: depth
  output_path: /app/outputs/ego-ego_nuscene_finetune_mixed_98cams_td1_1 #_td1_rend1_test # outputs/test/nuscene #time_df4
  compute_scores: true


  