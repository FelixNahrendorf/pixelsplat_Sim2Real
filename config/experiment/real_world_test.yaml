# @package _global_

defaults:
  - override /dataset: nuscene
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips]

wandb:
  name: nuscene
  tags: [seed, 256x256]

dataset:
  image_shape: [256, 256]
  roots: [dataset/nuscene]

data_loader:
  train:
    batch_size: 1 # 7 

trainer:
  max_steps: 400_001

test:
  depth_mode: depth
  output_path: /app/outputs/carla_on_nuscene_0shot_td1_rend1 # outputs/test/nuscene #time_df4
  compute_scores: true


  