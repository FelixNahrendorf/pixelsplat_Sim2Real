# @package _global_

defaults:
  - override /dataset: nuscene
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips]

wandb:
  name: nuscene
  tags: [seed, 128x128] #[256x256]

dataset:
  image_shape: [128, 128] #[64, 64] #
  roots: [dataset/nuscene]
  experiment: ego-ego #ego-exo-mixed #ego-ego 
  training_towns: ['01','03','04','05','06','07', '10HD']  
  testing_towns: ['02']

data_loader:
  train:
    batch_size: 2 # 7 

trainer:
  max_steps: 300_001 #400_001

test:
  depth_mode: depth
