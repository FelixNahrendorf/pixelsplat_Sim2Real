# @package _global_

defaults:
  - override /dataset: nuscene
  - override /model/encoder: epipolar
  - override /model/encoder/backbone: dino
  - override /loss: [mse, lpips]

wandb:
  name: nuscene
  tags: [seed, 256x256]

dataset:
  image_shape: [128, 128] #[64, 64] #[256, 256]
  roots: [dataset/nuscene]
  experiment: ego-ego #ego-exo-mixed #ego-ego 

data_loader:
  train:
    batch_size: 1 # 7 

trainer:
  max_steps: 400_001

test:
  depth_mode: depth
  output_path: /app/outputs/pixelsplat_new_training_Diverse_Ego-Exo_SEED4D-eval_ego-ego_Nuscene
  compute_scores: true


  